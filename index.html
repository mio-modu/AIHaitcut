<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>루메인 헤어 · Lumain Hair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <!-- ?v= 는 캐시 무효화용. css/js 를 고치면 숫자를 올린다 (태블릿이 옛 파일을 물고 있지 않도록) -->
  <link rel="stylesheet" href="css/styles.css?v=5" />
</head>
<body>
  <div id="app">

    <!-- ================= 상단 네비 ================= -->
    <header id="topbar">
      <div class="brand" id="brandHome">
        <span class="brand-mark">L</span>
        <span class="brand-text"><b>Lumain Hair</b><em>Salon Preview Studio</em></span>
      </div>
      <div class="topbar-right">
        <span class="credit-pill" id="creditPill">CREDIT <b id="creditCount">50</b></span>
        <button class="ghost-btn" id="navStyles">스타일 관리</button>
        <button class="ghost-btn" id="navHistory">이력</button>
        <button class="ghost-btn" id="navSettings" title="AI 엔진 설정">설정</button>
      </div>
    </header>

    <!-- ================= 스튜디오 (한 화면 통합) ================= -->
    <main id="screens"></main>

    <!-- ================= 하단 고지 ================= -->
    <footer id="disclaimer-bar">
      <span class="disc-icon">▍</span>
      <span>촬영 전 <b>개인정보 동의</b>가 필요합니다 · 사진은 생성 후 <b>자동 삭제</b>됩니다 · 결과는 참고용 예상 이미지입니다</span>
    </footer>

  </div>

  <script src="js/data.js?v=5"></script>
  <script src="js/generate.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
</body>
</html>
