<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>루메인 헤어 · Lumain Hair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 앱 루트: 화면(screen)들이 여기 안에서 전환됨 -->
  <div id="app">

    <!-- ================= 상단 바 ================= -->
    <header id="topbar">
      <div class="brand" id="brandHome">
        <span class="brand-mark">L</span>
        <span class="brand-text">루메인 헤어 <em>Lumain Hair</em></span>
      </div>
      <div class="topbar-right">
        <span class="credit-pill" id="creditPill" title="남은 생성 크레딧">크레딧 <b id="creditCount">50</b></span>
        <button class="ghost-btn" id="navStyles">스타일 카드</button>
        <button class="primary-btn" id="navGreet">손님 응대 시작</button>
      </div>
    </header>

    <!-- ================= 화면 컨테이너 ================= -->
    <main id="screens"></main>

    <!-- ================= 하단 고정 고지 ================= -->
    <footer id="disclaimer-bar" hidden>
      <span class="disc-icon">ⓘ</span>
      <span>이 이미지는 스타일 방향을 함께 보기 위한 <b>참고용 예상 이미지</b>입니다. 모발 상태·길이·시술 조건에 따라 실제 결과는 달라집니다.</span>
    </footer>

  </div>

  <!-- 화면 템플릿들 -->
  <template id="tpl-home"></template>

  <script src="js/data.js"></script>
  <script src="js/generate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
